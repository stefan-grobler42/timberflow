<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-12">
                <div id="stock-content-test"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components/simple-stock-manager.js"></script>
    <script>
        // Test the stock manager in isolation
        console.log('Starting stock management test...');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing stock manager...');
            
            try {
                const stockManager = new SimpleStockManager('stock-content-test');
                console.log('Stock manager initialized successfully');
                
                // Test clicking after a delay
                setTimeout(() => {
                    console.log('Testing click events...');
                    const firstRow = document.querySelector('.clickable-row');
                    if (firstRow) {
                        console.log('First row found, adding test click listener');
                        firstRow.addEventListener('click', () => {
                            console.log('TEST: Row clicked successfully!');
                        });
                    }
                    
                    const newBtn = document.getElementById('new-item-btn');
                    if (newBtn) {
                        console.log('New button found, adding test click listener');
                        newBtn.addEventListener('click', () => {
                            console.log('TEST: New button clicked successfully!');
                        });
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Failed to initialize stock manager:', error);
            }
        });
    </script>
</body>
</html>
