<!DOCTYPE html>
<html>
<head>
    <title>Stock Module Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Stock Management Debug</h2>
        <div id="debug-log" class="alert alert-info">
            <strong>Debug Log:</strong>
            <pre id="log-content"></pre>
        </div>
        <div id="stock-management-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple logging
        function log(message) {
            console.log(message);
            const logElement = document.getElementById('log-content');
            logElement.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }

        log('Starting stock management debug...');
        
        // Load the stock manager
        window.bootstrap = bootstrap; // Make available globally
    </script>
    <script src="components/advanced-stock-manager.js"></script>
    <script>
        log('Advanced Stock Manager script loaded');
        
        try {
            log('Creating Advanced Stock Manager instance...');
            const stockManager = new AdvancedStockManager('stock-management-content');
            log('Stock Manager created successfully');
        } catch (error) {
            log('ERROR: ' + error.message);
            log('Stack: ' + error.stack);
        }
    </script>
</body>
</html>
